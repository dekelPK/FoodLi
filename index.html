<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>FoodLi</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="theme-color" content="#f6f4fb">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Assistant:wght@400;500;600;700&family=Fredoka:wght@500;600;700&display=swap">
<link rel="stylesheet" href="style.css">
</head>
<body>
<div id="app" dir="rtl" lang="he">
  <header class="topbar">
    <button class="topbar-title" id="go-cover" type="button" aria-label="לכריכה"></button>
    <button class="chip-btn" id="go-toc" type="button">תוכן עניינים</button>
  </header>

  <main class="stage" id="stage" aria-live="polite"></main>

  <nav class="controls" aria-label="דפדוף">
    <button class="nav-btn" id="prev" type="button" aria-label="הקודם"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 5l7 7-7 7" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/></svg></button>
    <div class="controls-mid">
      <span class="folio" id="folio"></span>
      <button class="chip-btn" id="wake" type="button" aria-pressed="false" title="המסך לא ייכבה בזמן הבישול" hidden>מסך דולק</button>
    </div>
    <button class="nav-btn" id="next" type="button" aria-label="הבא"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M15 5l-7 7 7 7" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/></svg></button>
  </nav>
</div>
<script src="recipes.js"></script>
<script src="app.js"></script>
</body>
</html>
