<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>FoodLi</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="theme-color" content="#fff8f1">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Amatic+SC:wght@700&family=Assistant:wght@400;600;700;800&family=Karantina:wght@400;700&display=swap">
<link rel="stylesheet" href="style.css">
</head>
<body>
<div id="app" dir="rtl" lang="he">
  <header class="topbar">
    <button class="logo" id="go-cover" type="button" aria-label="לכריכה"></button>
    <button class="sticker-btn" id="go-toc" type="button">תוכן עניינים</button>
  </header>

  <main class="stage" id="stage" aria-live="polite"></main>

  <nav class="controls" aria-label="דפדוף">
    <button class="nav-btn" id="prev" type="button" aria-label="הקודם"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 5l7 7-7 7" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/></svg></button>
    <div class="controls-mid">
      <span class="folio" id="folio"></span>
      <button class="sticker-btn small" id="wake" type="button" aria-pressed="false" title="המסך לא ייכבה בזמן הבישול" hidden>מסך דולק</button>
    </div>
    <button class="nav-btn" id="next" type="button" aria-label="הבא"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M15 5l-7 7 7 7" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/></svg></button>
  </nav>

  <input type="file" id="photo-input" accept="image/*" hidden>

  <div class="modal" id="story-modal" role="dialog" aria-modal="true" aria-labelledby="story-title" hidden>
    <div class="modal-card">
      <h2 id="story-title">הסטורי מוכן</h2>
      <div class="story-preview" id="story-preview"><span class="loading">מכינה את התמונה…</span></div>
      <p class="modal-hint" id="story-hint">אפשר גם ללחוץ לחיצה ארוכה על התמונה כדי לשמור אותה.</p>
      <div class="modal-actions">
        <button class="sticker-btn primary" id="story-save" type="button">שמירה ושיתוף</button>
        <button class="sticker-btn" id="story-close" type="button">סגירה</button>
      </div>
      <p class="modal-status" id="story-status" role="status"></p>
    </div>
  </div>
</div>
<script src="recipes.js"></script>
<script src="app.js"></script>
</body>
</html>
